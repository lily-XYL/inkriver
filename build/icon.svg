<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5e9"/>
      <stop offset="100%" stop-color="#efe3c9"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cda05f"/>
      <stop offset="55%" stop-color="#a97432"/>
      <stop offset="100%" stop-color="#7c5320"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4f5e"/>
      <stop offset="100%" stop-color="#21242c"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d8c7a2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d8c7a2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#4a3a20" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 宣纸底 -->
  <rect x="24" y="24" width="976" height="976" rx="210" fill="url(#paper)"/>
  <circle cx="290" cy="250" r="270" fill="url(#wash)"/>
  <circle cx="810" cy="740" r="310" fill="url(#wash)"/>

  <!-- 笔锋落下的墨迹（如河流） -->
  <g filter="url(#shadow)">
    <path d="M 540 500
             C 470 540 400 572 330 612
             C 262 650 204 692 152 750"
          fill="none" stroke="url(#ink)" stroke-width="104" stroke-linecap="round"/>
    <path d="M 562 478
             C 500 524 438 556 372 584"
          fill="none" stroke="#6a7080" stroke-width="26" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 毛笔 -->
  <g transform="rotate(38 704 300)">
    <!-- 竹笔杆 -->
    <rect x="676" y="44" width="56" height="334" rx="26" fill="url(#bamboo)" filter="url(#shadow)"/>
    <rect x="683" y="134" width="42" height="11" rx="5" fill="#5f3d1c" opacity="0.78"/>
    <rect x="683" y="224" width="42" height="11" rx="5" fill="#5f3d1c" opacity="0.78"/>
    <rect x="682" y="48" width="13" height="326" rx="6" fill="#f0d39a" opacity="0.55"/>
    <!-- 笔斗 -->
    <rect x="666" y="362" width="76" height="34" rx="12" fill="#dcc79e"/>
    <rect x="666" y="396" width="76" height="11" rx="5" fill="#7c5320" opacity="0.55"/>
    <!-- 笔毫 -->
    <path d="M 704 406
             C 676 450 664 496 664 538
             C 664 562 704 568 704 568
             C 704 568 744 562 744 538
             C 744 496 732 450 704 406 Z"
          fill="url(#ink)"/>
    <path d="M 704 406 C 691 442 684 480 683 522"
          fill="none" stroke="#767d8d" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- 朱红印章 -->
  <g transform="translate(766 746)">
    <rect width="114" height="114" rx="20" fill="#b23a2f"/>
    <rect x="9" y="9" width="96" height="96" rx="14" fill="none" stroke="#f8f2e4" stroke-width="5" opacity="0.88"/>
    <text x="57" y="79" text-anchor="middle" font-family="KaiTi, STKaiti, SimSun, serif" font-size="70" fill="#f8f2e4">墨</text>
  </g>

  <rect x="44" y="44" width="936" height="936" rx="192" fill="none" stroke="#8a6d3b" stroke-width="6" opacity="0.28"/>
</svg>
